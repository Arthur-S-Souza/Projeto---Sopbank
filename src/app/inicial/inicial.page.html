<ion-content class="landing">
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <section class="hero ion-padding">
    <div class="brand-badge">
      <ion-icon name="wallet"></ion-icon>
    </div>
    <h1>SopWallet</h1>
    <p>Sua carteira virtual completa — Pix, transferências e extrato em tempo real.</p>

    <div class="feature-row">
      <div><ion-icon name="flash-outline"></ion-icon><span>Pix instantâneo</span></div>
      <div><ion-icon name="shield-checkmark-outline"></ion-icon><span>Conta segura</span></div>
      <div><ion-icon name="stats-chart-outline"></ion-icon><span>Extrato inteligente</span></div>
    </div>
  </section>

  <ion-footer class="landing-footer ion-no-border">
    <ion-toolbar>
      <ion-button expand="block" class="landing-btn" color="secondary" routerLink="/login">Entrar</ion-button>
      <ion-button expand="block" class="landing-btn" fill="outline" color="light" routerLink="/cadastro">Abrir carteira</ion-button>
    </ion-toolbar>
  </ion-footer>
</ion-content>
