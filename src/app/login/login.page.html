<ion-content class="auth-page ion-padding">
  <ion-buttons>
    <ion-button fill="clear" routerLink="/" aria-label="Voltar">
      <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
    </ion-button>
  </ion-buttons>

  <div class="auth-header">
    <ion-icon name="person-circle-outline" class="auth-avatar"></ion-icon>
    <h1>Login</h1>
    <p>Acesse sua conta Sopbank</p>
  </div>

  <ion-list lines="full" class="auth-form">
    <ion-item>
      <ion-label position="stacked">E-mail</ion-label>
      <ion-input type="email" [(ngModel)]="email" autocomplete="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Senha</ion-label>
      <ion-input type="password" [(ngModel)]="senha" autocomplete="current-password"></ion-input>
    </ion-item>
  </ion-list>

  <div class="auth-actions">
    <ion-button expand="block" fill="outline" color="dark" routerLink="/">Cancelar</ion-button>
    <ion-button expand="block" color="dark" (click)="entrar()">Entrar</ion-button>
    <ion-button expand="block" fill="clear" routerLink="/cadastro">Criar conta</ion-button>
  </div>
</ion-content>
