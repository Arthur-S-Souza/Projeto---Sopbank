<ion-content class="auth-page">
  <div class="auth-card ion-padding">
    <ion-buttons>
      <ion-button fill="clear" color="light" routerLink="/" aria-label="Voltar">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>

    <div class="auth-header">
      <ion-icon name="log-in-outline" class="auth-avatar"></ion-icon>
      <h1>Bem-vindo de volta</h1>
      <p>Entre na sua carteira SopWallet</p>
    </div>

    <ion-list lines="none" class="auth-form">
      <ion-item>
        <ion-label position="stacked">E-mail</ion-label>
        <ion-input type="email" [(ngModel)]="email" autocomplete="email"></ion-input>
      </ion-item>
      <ion-item>
        <ion-label position="stacked">Senha</ion-label>
        <ion-input type="password" [(ngModel)]="senha" autocomplete="current-password"></ion-input>
      </ion-item>
    </ion-list>

    <div class="auth-actions">
      <ion-button expand="block" color="secondary" [disabled]="carregando" (click)="entrar()">
        {{ carregando ? 'Entrando...' : 'Entrar' }}
      </ion-button>
      <ion-button expand="block" fill="clear" color="light" routerLink="/cadastro">Criar carteira</ion-button>
    </div>
  </div>
</ion-content>
