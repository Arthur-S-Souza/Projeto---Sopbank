<ion-content class="auth-page ion-padding">
  <ion-buttons>
    <ion-button fill="clear" routerLink="/" aria-label="Voltar">
      <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
    </ion-button>
  </ion-buttons>

  <div class="auth-header">
    <ion-icon name="person-add-outline" class="auth-avatar"></ion-icon>
    <h1>Cadastro</h1>
    <p>Abra sua conta digital Sopbank</p>
  </div>

  <ion-list lines="full" class="auth-form">
    <ion-item>
      <ion-label position="stacked">Nome completo</ion-label>
      <ion-input type="text" [(ngModel)]="nome" autocomplete="name"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">E-mail</ion-label>
      <ion-input type="email" [(ngModel)]="email" autocomplete="email"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Senha</ion-label>
      <ion-input type="password" [(ngModel)]="senha" autocomplete="new-password"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Telefone</ion-label>
      <ion-input type="tel" [(ngModel)]="telefone" autocomplete="tel"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">CPF</ion-label>
      <ion-input inputmode="numeric" [(ngModel)]="cpf"></ion-input>
    </ion-item>
    <ion-item>
      <ion-label position="stacked">Data de nascimento</ion-label>
      <ion-input type="date" [(ngModel)]="dataNascimento"></ion-input>
    </ion-item>
  </ion-list>

  <div class="auth-actions">
    <ion-button expand="block" fill="outline" color="dark" routerLink="/">Cancelar</ion-button>
    <ion-button expand="block" color="dark" (click)="cadastrar()">Cadastrar</ion-button>
  </div>
</ion-content>
